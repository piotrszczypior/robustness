  - name: "fragile_classes_similarity_matrix_glass_blur_1"
    type: "similarity_matrix"
    title: "Comparison of Fragile Classes: ImageNet-C Glass Blur Severity 1"
    x_label: "Model Architecture"
    y_label: "Class Index"
    content:
      - name: "ResNet-152"
        data: "resnet152_blur_glass_blur_1/resnet152_blur_glass_blur_1_classes.json"
      - name: "ResNet-50"
        data: "resnet50_blur_glass_blur_1/resnet50_blur_glass_blur_1_classes.json"
      - name: "EfficientNet-B4"
        data: "efficientnet_b4_blur_glass_blur_1/efficientnet_b4_blur_glass_blur_1_classes.json"
      - name: "ConvNeXt-Base"
        data: "convnext_base_blur_glass_blur_1/convnext_base_blur_glass_blur_1_classes.json"
      - name: "ViT-B/16"
        data: "vit_b_16_blur_glass_blur_1/vit_b_16_blur_glass_blur_1_classes.json"
    output: "images/fragile_classes_similarity_matrix_glass_blur_1.png"

  - name: "fragile_classes_similarity_matrix_defocus_blur_1"
    type: "similarity_matrix"
    title: "Comparison of Fragile Classes: ImageNet-C Defocus Blur Severity 1"
    x_label: "Model Architecture"
    y_label: "Class Index"
    content:
      - name: "ResNet-152"
        data: "resnet152_blur_defocus_blur_1/resnet152_blur_defocus_blur_1_classes.json"
      - name: "ResNet-50"
        data: "resnet50_blur_defocus_blur_1/resnet50_blur_defocus_blur_1_classes.json"
      - name: "EfficientNet-B4"
        data: "efficientnet_b4_blur_defocus_blur_1/efficientnet_b4_blur_defocus_blur_1_classes.json"
      - name: "ConvNeXt-Base"
        data: "convnext_base_blur_defocus_blur_1/convnext_base_blur_defocus_blur_1_classes.json"
      - name: "ViT-B/16"
        data: "vit_b_16_blur_defocus_blur_1/vit_b_16_blur_defocus_blur_1_classes.json"
    output: "images/fragile_classes_similarity_matrix_defocus_blur_1.png"

  - name: "fragile_classes_similarity_matrix_zoom_blur_1"
    type: "similarity_matrix"
    title: "Comparison of Fragile Classes: ImageNet-C Zoom Blur Severity 1"
    x_label: "Model Architecture"
    y_label: "Class Index"
    content:
      - name: "ResNet-152"
        data: "resnet152_blur_zoom_blur_1/resnet152_blur_zoom_blur_1_classes.json"
      - name: "ResNet-50"
        data: "resnet50_blur_zoom_blur_1/resnet50_blur_zoom_blur_1_classes.json"
      - name: "EfficientNet-B4"
        data: "efficientnet_b4_blur_zoom_blur_1/efficientnet_b4_blur_zoom_blur_1_classes.json"
      - name: "ConvNeXt-Base"
        data: "convnext_base_blur_zoom_blur_1/convnext_base_blur_zoom_blur_1_classes.json"
      - name: "ViT-B/16"
        data: "vit_b_16_blur_zoom_blur_1/vit_b_16_blur_zoom_blur_1_classes.json"
    output: "images/fragile_classes_similarity_matrix_zoom_blur_1.png"

  - name: "blur_types_similarity_matrix_resnet50"
    type: "similarity_matrix"
    title: "Comparison of Blur Types Similarity: ResNet-50 (Severity 1)"
    x_label: "Corruption Type"
    y_label: "Corruption Type"
    content:
      - name: "Defocus Blur"
        data: "resnet50_blur_defocus_blur_1/resnet50_blur_defocus_blur_1_classes.json"
      - name: "Glass Blur"
        data: "resnet50_blur_glass_blur_1/resnet50_blur_glass_blur_1_classes.json"
      - name: "Motion Blur"
        data: "resnet50_blur_motion_blur_1/resnet50_blur_motion_blur_1_classes.json"
      - name: "Zoom Blur"
        data: "resnet50_blur_zoom_blur_1/resnet50_blur_zoom_blur_1_classes.json"
    output: "images/blur_types_comparison_resnet50.png"
