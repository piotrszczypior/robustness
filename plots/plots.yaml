  - name: "conv_resnet152"
    type: "fragile_class"
    title: "Comparison of Fragile Classes: ConvNeXt-Base vs ResNet152"
    x_label: ""
    y_label: "Class Index"
    output: "results/comparison_heatmap.pdf"
    content:
      models:
        - name: "ConvNeXt-Base"
          data: "convnext_base_blur_defocus_blur_1/convnext_base_blur_defocus_blur_1_clases.json"
        - name: "ResNet-152"
          data: "resnet152_blur_defocus_blur_1/resnet152_blur_defocus_blur_1_clases.json"
    output: "images/fragile_classes1.png"
    
  - name: "conv_resnet152"
    type: "fragile_class2"
    title: "Comparison of Fragile Classes: ConvNeXt-Base vs ResNet152"
