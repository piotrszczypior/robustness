        - name: "ResNet-152"
          data: "resnet152_blur_defocus_blur_1/resnet152_blur_defocus_blur_1_clases.json"
        - name: "ConvNeXt-Base"
          data: "convnext_base_blur_defocus_blur_1/convnext_base_blur_defocus_blur_1_clases.json"
        - name: "ViT-b-16"
