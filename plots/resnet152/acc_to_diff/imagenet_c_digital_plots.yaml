plots:
  ###############
  # Digital - Contrast 
  ############### 
  - name: resnet152_imagenet_c_contrast_1
    title: "ResNet-152: Clean vs Accuracy Drop (Contrast 1)"
    type: scatter
    aux_line: "y=0"
    x:
      label: "Accuracy (Clean ImageNet)"
      data: "resnet152_imagenet.csv"
      recipe: accuracy
    y:
      label: "Accuracy (Contrast 1)"
      data: "resnet152_imagenet_c_contrast_1.csv"
      recipe: accuracy
      operation: diff
      lim: [-1, 1]
    output: "images/resnet152/acc_to_diff/resnet152_accuracy_vs_difference_contrast_1.png"

