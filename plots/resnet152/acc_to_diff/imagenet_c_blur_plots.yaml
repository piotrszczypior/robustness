plots:
  - name: resnet152_accuracy_vs_difference_defocus_blur_1
    title: "ResNet-152: Accuracy vs. Accuracy Drop (Defocus Blur 1)"
    type: scatter
    aux_line: "y=0"
    x:
      label: "Accuracy (Clean ImageNet)"
      data: "resnet152_imagenet.csv"
      recipe: accuracy
    y:
      label: "Accuracy difference (Clean - Defocus Blur 1)"
      data: "resnet152_imagenet_c_blur_defocus_blur_1.csv"
      recipe: accuracy
      operation: diff
      lim: [-1, 1]
    output: "images/resnet152/acc_to_diff/resnet152_accuracy_vs_difference_defocus_blur_1.png"


